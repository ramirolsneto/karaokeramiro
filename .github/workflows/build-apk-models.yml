name: Build APK with models
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pacotes do Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Baixar whisper.cpp
        run: git clone --depth 1 --branch v1.7.1 https://github.com/ggml-org/whisper.cpp app/src/main/cpp/whisper.cpp

      - name: Baixar Sherpa-ONNX
        run: |
          set -euo pipefail
          SHERPA_VERSION=1.13.8
          curl -fsSL "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-v${SHERPA_VERSION}-android.tar.bz2" -o /tmp/sherpa-onnx-android.tar.bz2
          mkdir -p /tmp/sherpa-onnx app/src/main/jniLibs/arm64-v8a app/src/main/cpp/include/sherpa-onnx/c-api
          tar -xjf /tmp/sherpa-onnx-android.tar.bz2 -C /tmp/sherpa-onnx
          cp /tmp/sherpa-onnx/jniLibs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          curl -fsSL "https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/v${SHERPA_VERSION}/sherpa-onnx/c-api/c-api.h" -o app/src/main/cpp/include/sherpa-onnx/c-api/c-api.h
          test -f app/src/main/jniLibs/arm64-v8a/libsherpa-onnx-c-api.so
          test -f app/src/main/cpp/include/sherpa-onnx/c-api/c-api.h

      - name: Baixar modelos de IA
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          MODEL_DIR=app/src/main/assets/models
          curl -fL "https://huggingface.co/csukuangfj/sherpa-onnx-spleeter-2stems-fp16/resolve/93ba771920ade509f8cbd6825b1a90856c797e08/vocals.fp16.onnx" -o "$MODEL_DIR/vocals.fp16.onnx"
          curl -fL "https://huggingface.co/csukuangfj/sherpa-onnx-spleeter-2stems-fp16/resolve/93ba771920ade509f8cbd6825b1a90856c797e08/accompaniment.fp16.onnx" -o "$MODEL_DIR/accompaniment.fp16.onnx"
          curl -fL "https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base.bin" -o "$MODEL_DIR/ggml-base.bin"
          test -s "$MODEL_DIR/vocals.fp16.onnx"
          test -s "$MODEL_DIR/accompaniment.fp16.onnx"
          test -s "$MODEL_DIR/ggml-base.bin"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK assinado para teste
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verificar assinatura
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: karaoke-ia-apk-modelos
          path: app/build/outputs/apk/debug/app-debug.apk
