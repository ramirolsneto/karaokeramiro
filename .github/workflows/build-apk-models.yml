name: Build APK with models
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pacotes do Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Baixar modelos locais com versões e checksums fixados
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          MODEL_DIR=app/src/main/assets/models
          DEMUCS_URL="https://huggingface.co/StemSplitio/htdemucs-ft-vocals-onnx/resolve/2ef0d757d3e226d0da85fb8c71514f464fcabdd0/htdemucs_ft_vocals.onnx"
          curl -fL "$DEMUCS_URL" -o "$MODEL_DIR/htdemucs_ft_vocals.onnx"
          echo "8c5d5e2da1f27050240bb80236673307ee3b40d4b064066d9350f4d64bfd544d  $MODEL_DIR/htdemucs_ft_vocals.onnx" | sha256sum -c -
          curl -fL "https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base.bin" -o "$MODEL_DIR/ggml-base.bin"
          test -s "$MODEL_DIR/ggml-base.bin"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Testes unitários focados em áudio/Demucs
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK assinado para teste
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verificar assinatura
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: karaoke-ia-apk-modelos
          path: app/build/outputs/apk/debug/app-debug.apk
